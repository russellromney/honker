name: zizmor · workflow lint

# zizmor audits GitHub Actions workflows for the footguns documented in
# https://nesbitt.io/2026/04/28/github-actions-is-the-weakest-link.html
# (pull_request_target on untrusted forks, template injection in run:
# steps, mutable action references in workflows that hold secrets,
# excessive default permissions, cache poisoning, etc.).
#
# Failing this job blocks the PR — fix the flagged issue or add a
# zizmor ignore comment with a reason. That only holds if `zizmor` is
# actually one of the required status checks in branch protection
# (alongside `ci · all green`; ci.yml's aggregate cannot cover a job in
# another workflow).
#
# Being required is why the `pull_request` trigger carries no `paths`
# filter. A required check that never reports is not treated as a pass
# — it pins the PR in "Expected — waiting for status" forever — so a
# path-filtered workflow cannot safely be required. Running zizmor on
# every PR costs a few seconds of runner time and removes that trap.
# It also still covers the case the filter was written for: a PR that
# weakens `.github/zizmor.yml` is linted either way.
#
# The `push` trigger keeps its filter — branch protection only
# evaluates checks from `pull_request` runs, and on main this is just
# a post-merge backstop.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/zizmor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5  # v0.6.1
        with:
          # Fail only on actionable findings. The "informational"
          # bucket includes nudges like use-trusted-publishing
          # (we considered and decided against OIDC).
          min-severity: low
          # Don't upload SARIF to the Security tab. The action
          # defaults to advanced-security: true, which needs
          # `security-events: write`; we run with `contents: read`
          # only on principle, so granting that just for one action
          # widens the blast radius. Findings show as PR-inline
          # annotations and in the job log instead — same actionable
          # info, no extra permission.
          advanced-security: false
          annotations: true
