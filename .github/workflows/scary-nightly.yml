name: Proof · scary nightly

on:
  workflow_dispatch:
  schedule:
    # Weekday morning UTC. Not PR-default; this is bigger proof.
    - cron: "23 7 * * 1-5"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scary-python-core:
    name: scary core · ubuntu
    timeout-minutes: 35
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup default stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
      - name: Build Python binding
        shell: bash
        run: |
          uv venv --python "3.14" .venv
          . .venv/bin/activate
          uv pip install pytest pytest-asyncio pytest-xdist maturin
          cargo build --locked --release -p honker-extension
          scripts/copy-python-extension.sh
          cd packages/honker
          maturin develop --release
      - name: Cross-process and crash proofs
        shell: bash
        run: |
          . .venv/bin/activate
          python -m pytest -q -n 0 --tb=short \
            tests/test_crash_recovery.py \
            tests/test_cross_process_wake_latency.py \
            tests/test_multiprocess.py \
            tests/test_real_e2e_scenarios.py \
            tests/test_resource_bounds.py \
            tests/test_real_app_example.py
      - name: Slow soak proofs
        shell: bash
        run: |
          . .venv/bin/activate
          python -m pytest -q -n 0 -o addopts="" -m slow tests/test_soak.py --tb=short
      - name: Linux fault-injection proofs
        shell: bash
        run: |
          . .venv/bin/activate
          python -m pytest -q -n 0 -o addopts="" -m linux_only tests/test_fault_injection.py --tb=short

  lifecycle-torture:
    # tests/test_lifecycle_torture.py, long variant: several minutes per
    # seed instead of the PR run's 25 s. Seeds are random each night
    # and printed, so a failure can be rerun with the same seed.
    name: lifecycle torture · ${{ matrix.os }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup default stable
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
      - name: Build honker-extension
        run: cargo build --locked --release -p honker-extension
      - name: Long lifecycle torture run
        shell: bash
        env:
          HONKER_TORTURE_SECONDS: "240"
        run: |
          export HONKER_TORTURE_SEEDS="$RANDOM,$RANDOM,$RANDOM"
          echo "HONKER_TORTURE_SEEDS=$HONKER_TORTURE_SEEDS"
          uv run --no-project --managed-python --python 3.14 --with pytest \
            python -m pytest tests/test_lifecycle_torture.py -o addopts="" -q -rsxX --tb=short

  packaged-installs:
    name: packaged installs · ubuntu
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup default stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f  # v1.306.0
        with:
          ruby-version: "3.4"
      - name: Run packaged install proof
        run: scripts/proof/package-install-smoke.sh
