name: Proof · npm Bun package

on:
  push:
    tags:
      - "bun-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: bun package
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup default stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          no-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: ""

      - name: Build extension and Python interop package
        run: |
          cargo build --locked --release -p honker-extension --features kernel-watcher,shm-fast-path
          uv venv --python "3.14" .venv
          . .venv/bin/activate
          uv pip install pytest pytest-xdist maturin
          cd packages/honker
          maturin develop --release --features kernel-watcher,shm-fast-path

      - name: Test Bun package
        working-directory: packages/honker-bun
        env:
          HONKER_EXT_PATH: ${{ github.workspace }}/target/release/libhonker_ext.so
          HONKER_INTEROP_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          bun install --frozen-lockfile
          bun test
          npm pack --pack-destination "$RUNNER_TEMP"

      - name: Upload npm package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: honker-bun-npm
          path: ${{ runner.temp }}/*.tgz
          if-no-files-found: error
