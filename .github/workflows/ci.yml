name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint · rustfmt + clippy
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          prefix-key: "v1-lint-${{ hashFiles('honker-core/src/**/*.rs', 'honker-core/Cargo.toml', 'honker-extension/src/**/*.rs', 'honker-extension/Cargo.toml') }}"
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The kernel-watcher / shm-fast-path code is cfg-gated, so the
      # default-feature run above never type-checks it. Lint it too —
      # same reasoning as the experimental test steps in the `rust` job.
      - name: cargo clippy (experimental wake backends)
        run: |
          cargo clippy --workspace --all-targets --locked \
            --features honker-core/kernel-watcher,honker-core/shm-fast-path \
            -- -D warnings

  rust:
    name: rust · honker-core + extension
    timeout-minutes: 8
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          prefix-key: "v1-rust-${{ hashFiles('honker-core/src/**/*.rs', 'honker-core/Cargo.toml', 'honker-extension/src/**/*.rs', 'honker-extension/Cargo.toml') }}"
      - name: Run honker-core tests (release)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cargo test -p honker-core --locked --release --lib --features bundled-sqlite
          else
            cargo test -p honker-core --locked --release --lib
          fi
      - name: Run honker-core tests (debug)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cargo test -p honker-core --locked --lib --features bundled-sqlite
          else
            cargo test -p honker-core --locked --lib
          fi
      # Experimental wake backends — see Phase Lighthouse in ROADMAP.md.
      # Failures here block Phase Lighthouse, not the wheel-building jobs
      # below.
      #
      # macOS uses bundled-sqlite here, and that is load-bearing rather
      # than incidental. Apple's system libsqlite3 takes its advisory
      # locks with fcntl(F_OFD_SETLK) — open-file-description locks, which
      # a foreign close() cannot release. The bindings that ship on macOS
      # (.NET/SQLitePCLRaw, Go, Ruby, and any bundled build) link an
      # upstream SQLite that uses plain fcntl(F_SETLK) instead, where a
      # foreign close drops every lock the process holds on that inode.
      # Issue #80 is only reproducible — and therefore only *testable* —
      # against the latter. Running macOS on the system library here would
      # make kernel_watcher_does_not_release_sqlite_wal_locks pass
      # vacuously. Linux's system libsqlite3 already uses F_SETLK, so it
      # stays unbundled and keeps non-bundled build coverage.
      - name: Run honker-core tests (experimental wake backends, debug)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cargo test -p honker-core --locked --lib --features kernel-watcher,shm-fast-path
          else
            cargo test -p honker-core --locked --lib --features bundled-sqlite,kernel-watcher,shm-fast-path
          fi
      - name: Run honker-core tests (experimental wake backends, release)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cargo test -p honker-core --locked --release --lib --features kernel-watcher,shm-fast-path
          else
            cargo test -p honker-core --locked --release --lib --features bundled-sqlite,kernel-watcher,shm-fast-path
          fi
      - name: Build loadable extension
        run: cargo build --locked --release -p honker-extension
      - name: Sanity-load via Python sqlite3
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sqlite3

          candidates = (
              "target/release/libhonker_ext.dylib",
              "target/release/libhonker_ext.so",
              "target/release/honker_ext.dll",
          )
          ext = None
          for cand in candidates:
              if os.path.exists(cand):
                  ext = os.path.abspath(cand)
                  break
          assert ext, f"extension artifact not found; tried: {candidates}"
          print(f"loading: {ext}")

          conn = sqlite3.connect(":memory:")
          if not hasattr(conn, "enable_load_extension"):
              print("sqlite3.Connection.enable_load_extension unavailable; skipping load test")
              raise SystemExit(0)
          try:
              conn.enable_load_extension(True)
          except sqlite3.NotSupportedError:
              print("sqlite3 was not compiled with load_extension; skipping load test")
              raise SystemExit(0)
          conn.load_extension(ext)
          conn.execute("SELECT honker_bootstrap()")
          conn.commit()

          cur = conn.execute(
              "SELECT honker_cron_next_after('0 3 * * *', 0)"
          ).fetchone()
          assert cur[0] > 0
          print(f"honker_cron_next_after -> {cur[0]}")
          PY

  perf-regression:
    name: bench · wal_index_methods (regression check)
    if: github.event_name != 'pull_request'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "bench/wal_index_methods"
          prefix-key: "v1-bench-${{ hashFiles('bench/wal_index_methods/Cargo.toml', 'bench/wal_index_methods/src/**/*.rs') }}"
      - name: Run wal_index_methods bench
        working-directory: bench/wal_index_methods
        run: |
          set -o pipefail
          cargo run --locked --release | tee /tmp/bench.out
      - name: Assert mmap-shm beats cached PRAGMA by >=50x
        run: |
          set -euo pipefail
          SHM=$(awk '/shm iChange \(safe dual-read/ {print $(NF-1)}' /tmp/bench.out)
          PRAGMA=$(awk '/PRAGMA data_version via cached prepared stmt/ {print $(NF-1)}' /tmp/bench.out)
          test -n "$SHM" || { echo "could not parse shm iChange line"; cat /tmp/bench.out; exit 1; }
          test -n "$PRAGMA" || { echo "could not parse cached PRAGMA line"; cat /tmp/bench.out; exit 1; }
          python3 -c "
          shm = float('$SHM')
          pragma = float('$PRAGMA')
          ratio = pragma / max(shm, 0.01)
          print(f'mmap shm iChange: {shm} ns/poll')
          print(f'cached PRAGMA:    {pragma} ns/poll')
          print(f'ratio:            {ratio:.0f}x')
          assert ratio >= 50, f'mmap-shm should be at least 50x faster than cached PRAGMA, got {ratio:.1f}x'
          "

  python:
    name: python · honker
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.14"},{"os":"macos-latest","python-version":"3.12"},{"os":"windows-latest","python-version":"3.12"}]' || '[{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.14"},{"os":"macos-latest","python-version":"3.12"},{"os":"macos-latest","python-version":"3.14"},{"os":"windows-latest","python-version":"3.12"},{"os":"windows-latest","python-version":"3.14"}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          prefix-key: "v1-src-${{ hashFiles('honker-core/src/**/*.rs', 'honker-core/Cargo.toml', 'honker-extension/src/**/*.rs', 'honker-extension/Cargo.toml') }}"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Create venv + install
        shell: bash
        run: |
          uv venv --python "${{ matrix.python-version }}" .venv
          if [ "${{ runner.os }}" = "Windows" ]; then
            VENV_PY=.venv/Scripts/python.exe
          else
            VENV_PY=.venv/bin/python
          fi
          uv pip install --python "$VENV_PY" pytest pytest-asyncio pytest-xdist maturin
      - name: Build honker-extension
        shell: bash
        run: |
          cargo build --locked --release -p honker-extension --features kernel-watcher,shm-fast-path
          scripts/copy-python-extension.sh
      - name: Build PyO3 _honker_native (maturin develop)
        working-directory: packages/honker
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            . ../../.venv/Scripts/activate
            maturin develop --release --features bundled-sqlite,kernel-watcher,shm-fast-path
          else
            . ../../.venv/bin/activate
            maturin develop --release --features kernel-watcher,shm-fast-path
          fi
      - name: Run pytest
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            . .venv/Scripts/activate
          else
            . .venv/bin/activate
          fi
          python -m pytest tests/ -q -n 0 --tb=short
      - name: Prove the documented Python ORM recipes
        shell: bash
        run: |
          # SQLAlchemy, SQLModel and Django, each wired the way
          # guides/orm/python.mdx shows. The wheel's bundled extension
          # is already in place from copy-python-extension.sh above.
          if [ "${{ runner.os }}" = "Windows" ]; then
            VENV_PY=.venv/Scripts/python.exe
            . .venv/Scripts/activate
          else
            VENV_PY=.venv/bin/python
            . .venv/bin/activate
          fi
          # uv venv does not ship pip, so install the way the rest of
          # this job does.
          uv pip install --python "$VENV_PY" --quiet sqlalchemy sqlmodel django

          # These recipes need an interpreter whose sqlite3 was built
          # with SQLITE_ENABLE_LOAD_EXTENSION. The python.org macOS
          # build that actions/setup-python ships is not. That is a real
          # property of the platform, not something to paper over — so
          # assert it rather than skipping quietly, and start running
          # the proofs the moment it changes.
          if ! python -c "import sqlite3, sys; sys.exit(0 if hasattr(sqlite3.connect(':memory:'), 'enable_load_extension') else 1)"; then
            if [ "${{ runner.os }}" = "macOS" ]; then
              echo "macOS setup-python has no SQLITE_ENABLE_LOAD_EXTENSION; the documented recipes cannot run on this interpreter"
              exit 0
            fi
            echo "this interpreter cannot load SQLite extensions, and only macOS setup-python is expected to be like that" >&2
            exit 1
          fi

          failed=0
          for scenario in scripts/proof/orm/python/*.py; do
            name="$(basename "$scenario" .py)"
            rm -f "$RUNNER_TEMP/orm-$name.db"
            if HONKER_TEST_DB="$RUNNER_TEMP/orm-$name.db" python "$scenario"; then
              :
            else
              echo "FAIL $name" >&2
              failed=1
            fi
          done
          exit "$failed"

  dotnet:
    name: dotnet · honker-dotnet
    timeout-minutes: 8
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            native_name: libhonker_ext.so
          - os: macos-14
            rid: osx-arm64
            native_name: libhonker_ext.dylib
          - os: windows-latest
            rid: win-x64
            native_name: honker_ext.dll
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          prefix-key: "v1-src-${{ hashFiles('honker-core/src/**/*.rs', 'honker-core/Cargo.toml', 'honker-extension/src/**/*.rs', 'honker-extension/Cargo.toml', 'packages/honker-dotnet/src/**/*.cs', 'packages/honker-dotnet/tests/**/*.cs', 'packages/honker-dotnet/**/*.csproj') }}"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build honker-extension
        run: cargo build --locked --release -p honker-extension --features kernel-watcher,shm-fast-path
      - name: Build .NET queue helper
        run: dotnet build packages/honker-dotnet/tests/Honker.QueueHelper/Honker.QueueHelper.csproj -c Release
      - name: Run .NET binding tests
        run: dotnet test packages/honker-dotnet/tests/Honker.Tests/Honker.Tests.csproj -c Release --verbosity normal
      - name: Pack NuGet smoke test
        shell: bash
        run: |
          mkdir -p "packages/honker-dotnet/src/Honker/package-assets/runtimes/${{ matrix.rid }}/native"
          cp "target/release/${{ matrix.native_name }}" "packages/honker-dotnet/src/Honker/package-assets/runtimes/${{ matrix.rid }}/native/${{ matrix.native_name }}"
          dotnet pack packages/honker-dotnet/src/Honker/Honker.csproj -c Release --no-restore -p:PackageVersion=0.0.0-ci.${{ github.run_number }} -o artifacts/honker-dotnet
      - name: Restore and run packaged consumer smoke test
        shell: bash
        run: |
          packages/honker-dotnet/scripts/smoke-consumer.sh artifacts/honker-dotnet

  node:
    name: node · honker-node
    # Windows runners, especially Node 24, spend several minutes in the
    # native build before the cross-language proofs can even start.
    timeout-minutes: 12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","node-version":"22"},{"os":"ubuntu-latest","node-version":"24"},{"os":"macos-latest","node-version":"22"},{"os":"windows-latest","node-version":"22"}]' || '[{"os":"ubuntu-latest","node-version":"22"},{"os":"ubuntu-latest","node-version":"24"},{"os":"macos-latest","node-version":"22"},{"os":"macos-latest","node-version":"24"},{"os":"windows-latest","node-version":"22"},{"os":"windows-latest","node-version":"24"}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-src-${{ hashFiles('honker-core/src/**/*.rs', 'honker-core/Cargo.toml', 'honker-extension/src/**/*.rs', 'honker-extension/Cargo.toml') }}"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Create venv + build Python extension
        shell: bash
        run: |
          uv venv --python "3.14" .venv
          if [ "${{ runner.os }}" = "Windows" ]; then
            VENV_PY=.venv/Scripts/python.exe
            ACTIVATE=.venv/Scripts/activate
          else
            VENV_PY=.venv/bin/python
            ACTIVATE=.venv/bin/activate
          fi
          uv pip install --python "$VENV_PY" maturin
          cd packages/honker
          . "../../$ACTIVATE"
          if [ "${{ runner.os }}" = "Windows" ]; then
            maturin develop --release --features bundled-sqlite,kernel-watcher,shm-fast-path
          else
            maturin develop --release --features kernel-watcher,shm-fast-path
          fi
      - name: Build .node binary
        working-directory: packages/honker-node
        shell: bash
        run: |
          npm ci
          npx napi build --platform --release --features kernel-watcher,shm-fast-path
      - name: Test (extension resolver — no addon load)
        working-directory: packages/honker-node
        shell: bash
        run: node --test test/extension.js
      - name: Check extension package version alignment
        shell: bash
        run: python3 scripts/proof/check-ext-version-alignment.py
      - name: Prove the packaged extension loads under better-sqlite3
        # Windows has no honker-ext package yet, so there is nothing to
        # pack there. Named rather than silently skipped.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) platform=linux-x64-gnu ;;
            macOS) platform=darwin-arm64 ;;
            *) echo "unexpected runner ${{ runner.os }}" >&2; exit 1 ;;
          esac
          cargo build --locked --release -p honker-extension
          case "$platform" in
            darwin-*) libname=libhonker_ext.dylib ;;
            *) libname=libhonker_ext.so ;;
          esac
          cp "target/release/$libname" "packages/honker-node/libhonker_ext.$platform.${libname##*.}"
          scripts/copy-node-extension.sh "$platform"
          scripts/proof/node-orm-extension.sh "$platform"
      - name: Test (basic — node only)
        working-directory: packages/honker-node
        shell: bash
        run: node --test test/api.test.js test/basic.js
      - name: Test (parity — node API surface)
        working-directory: packages/honker-node
        shell: bash
        run: node --test test/parity.test.js
      - name: Test (direct proof — python writes, node updateEvents observes)
        working-directory: packages/honker-node
        shell: bash
        run: node --test test/cross_lang_python_to_node.js
      - name: Test (direct proof — node writes, python listens)
        working-directory: packages/honker-node
        shell: bash
        run: node --test test/cross_lang_node_to_python.js
      - name: Test (supporting proof — cross-language shared rows/schema)
        working-directory: packages/honker-node
        shell: bash
        run: node --test test/cross_lang_supporting.js
      - name: Test (direct proof — node and python share queues, streams, notify)
        working-directory: packages/honker-node
        shell: bash
        run: node --test test/cross_lang_queue_stream_notify.js
      - name: Test watcher backend proofs
        working-directory: packages/honker-node
        shell: bash
        run: node --test test/watcher_backends.js test/watcher_backends_e2e.js test/watcher_backends_queue_e2e.js

  binding-smoke:
    name: binding smoke · ubuntu aggregate
    timeout-minutes: 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          prefix-key: "v1-bindings-${{ hashFiles('honker-core/src/**/*.rs', 'honker-core/Cargo.toml', 'honker-extension/src/**/*.rs', 'honker-extension/Cargo.toml', 'packages/honker/src/**/*.rs', 'packages/honker/Cargo.toml') }}"
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/honker-go/go.mod
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: mlugg/setup-zig@v2
        with:
          use-cache: false
      - uses: oven-sh/setup-bun@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.19"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install C++ binding deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev nlohmann-json3-dev
      - name: Build honker-extension
        run: |
          cargo build --locked --release -p honker-extension --features kernel-watcher,shm-fast-path
      - name: Build Python binding
        shell: bash
        run: |
          uv venv --python "3.14" .venv
          . .venv/bin/activate
          uv pip install pytest pytest-xdist maturin
          cd packages/honker
          maturin develop --release --features kernel-watcher,shm-fast-path
      - name: Rust wrapper
        env:
          HONKER_INTEROP_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: cargo test --locked --manifest-path packages/honker-rs/Cargo.toml --features kernel-watcher,shm-fast-path
      - name: Go
        working-directory: packages/honker-go
        env:
          HONKER_INTEROP_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: go test -tags sqlite_load_extension ./...
      - name: .NET Python interop
        env:
          HONKER_EXTENSION_PATH: ${{ github.workspace }}/target/release/libhonker_ext.so
          HONKER_INTEROP_PYTHON: ${{ github.workspace }}/.venv/bin/python
          HONKER_REQUIRE_INTEROP: "1"
        run: dotnet test packages/honker-dotnet/tests/Honker.Tests/Honker.Tests.csproj --filter FullyQualifiedName~PythonInteropTests --verbosity normal
      - name: C++
        working-directory: packages/honker-cpp
        env:
          HONKER_INTEROP_PYTHON: ${{ github.workspace }}/.venv/bin/python
          HONKER_REQUIRE_INTEROP: "1"
        run: zig build test -Dhonker-ext="${GITHUB_WORKSPACE}/target/release/libhonker_ext.so"
      - name: Bun
        working-directory: packages/honker-bun
        env:
          HONKER_EXT_PATH: ${{ github.workspace }}/target/release/libhonker_ext.so
          HONKER_INTEROP_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          bun install --frozen-lockfile
          bun test
      - name: Ruby
        working-directory: packages/honker-ruby
        env:
          HONKER_REQUIRE_RUBY_EXTENSION_LOADING: "1"
        run: |
          bundle install
          bundle exec ruby -e 'require "sqlite3"; db = SQLite3::Database.new(":memory:"); abort "sqlite3 gem lacks loadable-extension support" unless db.respond_to?(:enable_load_extension) && db.respond_to?(:load_extension)'
          bundle exec ruby -Ilib spec/honker_spec.rb
          bundle exec ruby -Ilib spec/smoke_spec.rb
          bundle exec ruby -Ilib spec/parity_spec.rb
          bundle exec ruby -Ilib spec/extension_resolution_spec.rb
          bundle exec ruby -Ilib spec/setup_helpers_spec.rb
          bundle exec ruby -Ilib spec/railtie_spec.rb
      - name: Elixir
        working-directory: packages/honker-ex
        env:
          HONKER_EXTENSION_PATH: ${{ github.workspace }}/target/release/libhonker_ext.so
          HONKER_INTEROP_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          mix deps.get
          mix test
      # ---- Documented ORM recipes -------------------------------------
      # One scenario per integration named in guides/orm/*.mdx, written
      # the way the page shows it. These fail when a documented recipe
      # stops working, which is the point: the docs promise these, so CI
      # has to hold them to it.
      - name: ORM · Go (database/sql, GORM)
        env:
          HONKER_EXTENSION_PATH: ${{ github.workspace }}/target/release/libhonker_ext.so
        run: |
          work="$RUNNER_TEMP/orm-go"
          mkdir -p "$work"
          cp scripts/proof/orm/go/main.go "$work/"
          cd "$work"
          cat > go.mod <<'GOMOD'
          module honkerormproof

          go 1.25
          GOMOD
          go mod edit -replace github.com/russellromney/honker-go="$GITHUB_WORKSPACE/packages/honker-go"
          go mod tidy
          HONKER_TEST_DB="$work/orm.db" go run .

      - name: ORM · Rust (sqlx)
        env:
          HONKER_EXTENSION_PATH: ${{ github.workspace }}/target/release/libhonker_ext.so
        run: |
          HONKER_TEST_DB="$RUNNER_TEMP/orm-sqlx.db" \
            cargo run --release --manifest-path scripts/proof/orm/rust/Cargo.toml

      - name: ORM · .NET (Microsoft.Data.Sqlite)
        env:
          HONKER_EXTENSION_PATH: ${{ github.workspace }}/target/release/libhonker_ext.so
        run: |
          HONKER_TEST_DB="$RUNNER_TEMP/orm-dotnet.db" \
            dotnet run --project scripts/proof/orm/dotnet/OrmProof.csproj

      - name: ORM · Elixir (Ecto)
        working-directory: packages/honker-ex
        env:
          HONKER_EXTENSION_PATH: ${{ github.workspace }}/target/release/libhonker_ext.so
        run: |
          mix compile
          HONKER_TEST_DB="$RUNNER_TEMP/orm-ecto.db" \
            elixir -pa _build/dev/lib/honker/ebin \
            "$GITHUB_WORKSPACE/scripts/proof/orm/elixir/ecto_proof.exs"

      - name: ORM · C++ (framework-owned sqlite3)
        env:
          HONKER_EXTENSION_PATH: ${{ github.workspace }}/target/release/libhonker_ext.so
        run: |
          g++ -std=c++17 scripts/proof/orm/cpp/orm_proof.cpp -lsqlite3 \
            -o "$RUNNER_TEMP/orm-cpp"
          HONKER_TEST_DB="$RUNNER_TEMP/orm-cpp.db" "$RUNNER_TEMP/orm-cpp"

      - name: ORM · Ruby (ActiveRecord)
        working-directory: packages/honker-ruby
        env:
          HONKER_EXTENSION_PATH: ${{ github.workspace }}/target/release/libhonker_ext.so
        run: |
          export BUNDLE_GEMFILE="$GITHUB_WORKSPACE/scripts/proof/orm/ruby/Gemfile"
          bundle install
          HONKER_TEST_DB="$RUNNER_TEMP/orm-ruby.db" \
            bundle exec ruby -I"$GITHUB_WORKSPACE/packages/honker-ruby/lib" \
            "$GITHUB_WORKSPACE/scripts/proof/orm/ruby/active_record_proof.rb"

      - name: Run Ruby ↔ Python interop
        shell: bash
        env:
          HONKER_REQUIRE_INTEROP: "1"
        run: |
          . .venv/bin/activate
          python -m pytest tests/test_ruby_python_interop.py -q --tb=short

  jvm:
    name: jvm · honker + documented ORM recipes
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-jvm-${{ hashFiles('honker-core/src/**/*.rs', 'honker-extension/src/**/*.rs') }}"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build honker-extension
        # The binding's kernel-listener tests need the experimental
        # backends compiled in, the same way the python, dotnet and
        # binding-smoke jobs build it.
        run: cargo build --locked --release -p honker-extension --features kernel-watcher,shm-fast-path
      - name: Build and install dev.honker:honker
        working-directory: packages/honker-jvm
        run: mvn -B -q -DskipTests install
      - name: Run honker-jvm tests
        working-directory: packages/honker-jvm
        env:
          HONKER_EXTENSION_PATH: ${{ github.workspace }}/target/release/libhonker_ext.so
        run: mvn -B test
      - name: ORM · JVM (JDBC, Hibernate, jOOQ)
        working-directory: scripts/proof/orm/jvm
        env:
          HONKER_EXTENSION_PATH: ${{ github.workspace }}/target/release/libhonker_ext.so
        run: |
          HONKER_TEST_DB="$RUNNER_TEMP/orm-jvm.db" \
            mvn -B -q compile exec:java -Dexec.mainClass=dev.honker.ormproof.OrmProof
      - name: ORM · Kotlin (Exposed)
        working-directory: scripts/proof/orm/jvm
        env:
          HONKER_EXTENSION_PATH: ${{ github.workspace }}/target/release/libhonker_ext.so
        run: |
          HONKER_TEST_DB="$RUNNER_TEMP/orm-kotlin.db" \
            mvn -B -q compile exec:java -Dexec.mainClass=dev.honker.ormproof.ExposedProof

  ci-ok:
    # THE required status check for everything in *this* workflow.
    #
    # Branch protection should require exactly two checks:
    #   - "ci · all green"  (this job)
    #   - "zizmor"          (.github/workflows/zizmor.yml)
    #
    # `needs:` cannot reach a job in another workflow, so this aggregate
    # does not and cannot subsume zizmor. Requiring only this job would
    # silently un-gate the workflow-security lint that guards the
    # release workflows holding publish tokens — exactly the check you
    # least want to drop. zizmor's `pull_request` trigger is
    # deliberately unfiltered so it reports on every PR and is safe to
    # require; see the comment at the top of that file.
    #
    # Why an aggregate instead of listing the real jobs: `python` and
    # `node` build their matrices with fromJson and deliberately run a
    # smaller set on pull_request than on push. That means their job
    # names differ by event, so any hand-maintained required-checks list
    # is either wrong on PRs or wrong on main. Worse, a required check
    # that never reports is indistinguishable from one that hasn't
    # started — a job silently dropped from the matrix would look like a
    # pending check forever, or (if the name is removed from protection)
    # like a pass. This job has one stable name and inspects results
    # directly, so neither failure mode is reachable.
    #
    # `if: always()` is load-bearing: without it the job is skipped when
    # any dependency fails, and a skipped required check reads as
    # success to branch protection.
    name: ci · all green
    if: always()
    needs:
      - lint
      - rust
      - perf-regression
      - python
      - dotnet
      - node
      - binding-smoke
      - jvm
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Assert every required job succeeded
        env:
          # Passed through env rather than interpolated into the script
          # body — same template-injection rule zizmor enforces on the
          # release workflows.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          # perf-regression is gated on `github.event_name != 'pull_request'`,
          # so it legitimately reports "skipped" on every PR. Nothing else
          # is allowed to skip.
          MAY_SKIP = {"perf-regression"}

          needs = json.loads(os.environ["NEEDS_JSON"])
          blocking = []
          for name, info in sorted(needs.items()):
              result = info["result"]
              ok = result == "success" or (result == "skipped" and name in MAY_SKIP)
              print(f"{'ok  ' if ok else 'FAIL'}  {name}: {result}")
              if not ok:
                  blocking.append(f"{name} ({result})")

          if blocking:
              sys.exit("blocking jobs not green: " + ", ".join(blocking))
          print("\nall required jobs green")
          PY
