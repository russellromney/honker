name: Proof · NuGet package

on:
  push:
    tags:
      - "dotnet-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-assets:
    name: native · ${{ matrix.rid }}
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            native_name: libhonker_ext.so
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            native_name: libhonker_ext.so
          - os: macos-latest
            rid: osx-x64
            native_name: libhonker_ext.dylib
            rust_target: x86_64-apple-darwin
          - os: macos-latest
            rid: osx-arm64
            native_name: libhonker_ext.dylib
          - os: windows-latest
            rid: win-x64
            native_name: honker_ext.dll
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup default stable
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Build native extension
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          cargo_args=(--locked --release -p honker-extension --features kernel-watcher,shm-fast-path)
          target_dir="target/release"
          if [[ -n "$RUST_TARGET" ]]; then
            rustup target add "$RUST_TARGET"
            cargo_args+=(--target "$RUST_TARGET")
            target_dir="target/$RUST_TARGET/release"
          fi
          cargo build "${cargo_args[@]}"
          mkdir -p "native-assets/runtimes/${{ matrix.rid }}/native"
          cp "$target_dir/${{ matrix.native_name }}" \
            "native-assets/runtimes/${{ matrix.rid }}/native/${{ matrix.native_name }}"

      - name: Upload native asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: native-${{ matrix.rid }}
          path: native-assets/runtimes
          if-no-files-found: error

  package:
    name: nuget package
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: native-assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Download native assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: native-*
          path: packages/honker-dotnet/src/Honker/package-assets/runtimes
          merge-multiple: true

      - name: Pack NuGet package
        shell: bash
        run: |
          dotnet pack packages/honker-dotnet/src/Honker/Honker.csproj \
            -c Release \
            -o artifacts/honker-dotnet
          python3 scripts/proof/check-dotnet-nuget.py artifacts/honker-dotnet/*.nupkg
          packages/honker-dotnet/scripts/smoke-consumer.sh artifacts/honker-dotnet

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: honker-nuget
          path: artifacts/honker-dotnet/*.nupkg
          if-no-files-found: error
